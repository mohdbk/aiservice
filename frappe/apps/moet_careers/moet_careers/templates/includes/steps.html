{# Application progress: current = 1 (account), 2 (application), 3 (CV check) #}
<ol class="aegov-step mb-8 flex flex-wrap gap-4" aria-label="{{ t('Application steps', 'خطوات التقديم') }}">
  {% for n, en, ar in [(1, 'Account', 'الحساب'), (2, 'Application', 'الطلب'), (3, 'Check your CV details', 'مراجعة بيانات السيرة الذاتية')] %}
  <li class="flex items-center gap-2 {{ 'step-completed' if n < current else ('step-current' if n == current else 'step-upcoming') }}" {% if n == current %}aria-current="step"{% endif %}>
    <span class="step-badge inline-flex h-8 w-8 items-center justify-center rounded-full border-2 text-sm font-bold
      {{ 'border-primary-600 bg-primary-600 text-white' if n <= current else 'border-aeblack-200 text-aeblack-500' }}">{{ '✓' if n < current else n }}</span>
    <span class="step-title text-sm {{ 'font-semibold text-aeblack-900' if n == current else 'text-aeblack-600' }}">{{ t(en, ar) }}</span>
  </li>
  {% endfor %}
</ol>
