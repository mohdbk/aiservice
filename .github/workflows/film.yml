name: Journey Film

# The whole stack with demo content, then screenshots of every backoffice and portal page in Arabic and English, on a
# desktop and a phone, with a report of anything wider than the screen. Images go to the "audit" branch.
on:
  workflow_dispatch:
  push:
    branches: [dotnet-backend]
    paths: ["e2e/film/**", ".github/workflows/film.yml"]

permissions:
  contents: write

jobs:
  film:
    runs-on: ubuntu-24.04
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci-Strong-Password-123"
          MSSQL_PID: Developer
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Ci-Strong-Password-123 -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 20
    env:
      DOTNET_NOLOGO: "1"
      ADMIN_EMAIL: admin@moet.test
      ADMIN_PASSWORD: Admin-Password-123
      AGENT_KEY: e2e-agent-key-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build
        run: |
          dotnet build backend/src/Moet.Recruitment.Api -c Release
          dotnet build portal/host/Moet.Careers.Portal -c Release
          (cd backoffice/web && npm install --no-audit --no-fund && npm run build)
          (cd portal/web && npm install --no-audit --no-fund && npm run build)
      - name: Start the stack (backoffice app with the assistant on :5080, portal on :8080)
        run: MODEL_SCRIPT=e2e/film/film-model.mjs DB_NAME=MoetFilm RUN_WORKERS=1 API_LLM_MODEL=film e2e/start-stack.sh
      - name: Film
        run: |
          mkdir -p e2e/run && cd e2e/run && npm init -y >/dev/null && npm install playwright@1.49.1 --no-audit --no-fund >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          python3 ../film/make-cvs.py cvs
          cp ../film/film.mjs . && BASE_URL=http://localhost:5080 PORTAL_URL=http://127.0.0.1:8080 REPO=../.. CVS=cvs node film.mjs
          cp ../film/cards.mjs . && REPO=../.. node cards.mjs
      - name: Logs
        if: always()
        run: |
          echo "--- api errors"; grep -n -A8 "fail:\|Exception" api.log | head -60; echo "--- model"; tail -40 model.log; echo "--- portal"; tail -30 portal.log
      - name: Push to the film branch
        if: always()
        run: |
          test -d e2e/run/film || exit 0
          cd e2e/run/film && git init -q -b film && git add . \
            && git -c user.name=film -c user.email=film@localhost commit -qm "Journey film ${GITHUB_SHA::7}" \
            && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" film
