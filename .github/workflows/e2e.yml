name: End to End

# The whole stack in CI as on IIS: SQL Server, the HRMS app (API, assistant with a stand-in model, staff app), the
# careers portal; then a phone browser
# signs in and uses the assistant panel.
on:
  push:
    branches-ignore: [film, screenshots, audit]
    paths: ["backend/**", "hrms/**", "portal/**", "e2e/**", ".github/workflows/e2e.yml"]
  workflow_dispatch:

jobs:
  assistant:
    runs-on: ubuntu-24.04
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci-Strong-Password-123"
          MSSQL_PID: Developer
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Ci-Strong-Password-123 -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 20
    env:
      DOTNET_NOLOGO: "1"
      ADMIN_EMAIL: admin@moet.test
      ADMIN_PASSWORD: Admin-Password-123
      AGENT_KEY: e2e-agent-key-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build
        run: |
          dotnet build backend/src/Moet.Hrms.Api -c Release
          dotnet build portal/host/Moet.Careers.Portal -c Release
          (cd hrms/web && npm install --no-audit --no-fund && npm run build)
          (cd portal/web && npm install --no-audit --no-fund && npm run build)
      - name: Chromium for PDF letters
        run: pwsh backend/src/Moet.Hrms.Api/bin/Release/net10.0/playwright.ps1 install --with-deps --only-shell chromium
      - name: Start the stack (HRMS app with the assistant on :5080, portal on :8080)
        run: MODEL_SCRIPT=e2e/fake-model.mjs DB_NAME=MoetE2e RUN_WORKERS=0 e2e/start-stack.sh
      - name: Assistant on a phone
        run: |
          mkdir -p e2e/run/shots && cd e2e/run && npm init -y >/dev/null && npm install playwright@1.49.1 --no-audit --no-fund >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cp ../assistant.mjs . && BASE_URL=http://localhost:5080 node assistant.mjs
      - name: Candidate journey in the careers portal
        run: |
          cd e2e/run && cp ../journey.mjs . && BASE_URL=http://localhost:5080 PORTAL_URL=http://127.0.0.1:8080 node journey.mjs
      - name: Lighthouse (accessibility and best practices floors)
        run: |
          cd e2e/run && cp ../lighthouse.mjs . && export CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")
          PORTAL_URL=http://127.0.0.1:8080 BASE_URL=http://localhost:5080 node lighthouse.mjs
      - name: Logs
        if: always()
        run: |
          echo "--- api errors"; grep -n -A12 "fail:\|Exception" api.log | head -80; echo "--- api"; tail -30 api.log; echo "--- model"; tail -20 model.log; echo "--- portal"; tail -30 portal.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: |
            e2e/run/shots/
            e2e/run/lighthouse/
