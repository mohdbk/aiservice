name: Design Audit

# The whole stack with demo content, then screenshots of every HRMS and portal page in Arabic and English, on a
# desktop and a phone, with a report of anything wider than the screen. Images go to the "audit" branch.
on:
  schedule:
    - cron: "41 23 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["e2e/audit.mjs", ".github/workflows/design-audit.yml"]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci-Strong-Password-123"
          MSSQL_PID: Developer
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Ci-Strong-Password-123 -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 20
    env:
      DOTNET_NOLOGO: "1"
      ADMIN_EMAIL: admin@moet.test
      ADMIN_PASSWORD: Admin-Password-123
      AGENT_KEY: e2e-agent-key-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build
        run: |
          dotnet build backend/src/Moet.Hrms.Api -c Release
          dotnet build portal/host/Moet.Careers.Portal -c Release
          (cd hrms/web && npm install --no-audit --no-fund && npm run build)
          (cd portal/web && npm install --no-audit --no-fund && npm run build)
      - name: Start the stack (HRMS app with the assistant on :5080, portal on :8080)
        run: SCENARIO=1 MODEL_SCRIPT=e2e/fake-model.mjs DB_NAME=MoetAudit RUN_WORKERS=0 e2e/start-stack.sh
      - name: Screenshots
        run: |
          mkdir -p e2e/run && cd e2e/run && npm init -y >/dev/null && npm install playwright@1.49.1 axe-core@4.10.2 --no-audit --no-fund >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cp ../audit.mjs . && BASE_URL=http://localhost:5080 PORTAL_URL=http://127.0.0.1:8080 node audit.mjs
      - name: Logs
        if: always()
        run: |
          echo "--- api errors"; grep -n -A8 "fail:\|Exception" api.log | head -60; echo "--- model"; tail -40 model.log; echo "--- portal"; tail -30 portal.log
      - name: Push to the audit branch
        if: always()
        run: |
          test -d e2e/run/shots || exit 0
          cd e2e/run/shots && git init -q -b audit && git add . \
            && git -c user.name=audit -c user.email=audit@localhost commit -qm "Design audit ${GITHUB_SHA::7}" \
            && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" audit
