name: Smoke Check Demo

on:
  workflow_dispatch:
  push:
    branches: [dotnet-backend]
    paths: [".github/smoke/**", ".github/workflows/smoke-demo.yml"]

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://recruitment-backoffice-production.up.railway.app
      PORTAL_URL: https://careers-portal-production-bd6b.up.railway.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Playwright
        working-directory: .github/smoke
        run: |
          npm init -y >/dev/null && npm install playwright@1.49.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Check
        working-directory: .github/smoke
        run: mkdir -p shots && node check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-screenshots
          path: .github/smoke/shots/
