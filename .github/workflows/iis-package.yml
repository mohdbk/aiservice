# Builds the IIS package (Ministry of Economy & Tourism) on Windows and installs it on a fresh IIS on the runner to
# check that the two sites start and talk to each other: the backoffice (staff app, API and assistant in one app) and
# the careers portal, and PDF letters with the bundled Chromium. There is no SQL Server on the runner, so the API runs
# without its database; everything checked here answers without one.
name: IIS Package

on:
  push:
    branches: [main, dotnet-backend]
    paths: ["deploy/iis/**", "portal/host/**", "backend/src/Moet.Recruitment.Api/**", ".github/workflows/iis-package.yml"]
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the package
        shell: pwsh
        run: ./deploy/iis/Build-Package.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: moet-recruitment-iis
          path: out/moet-recruitment-iis.zip
          retention-days: 30

      - name: IIS and the .NET 10 Hosting Bundle (nothing else)
        shell: powershell
        run: |
          Install-WindowsFeature Web-Server, Web-AppInit, Web-Scripting-Tools, Web-Mgmt-Console | Out-Null
          choco install dotnet-10.0-windowshosting -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco failed: $LASTEXITCODE" }
          net stop was /y
          net start w3svc

      - name: Install on IIS (Windows PowerShell 5.1, as on the servers)
        shell: powershell
        run: |
          $key = 'ci-portal-key'; $secret = 'ci-portal-secret-0123456789'
          @"
          @{
            InstallRoot = 'C:\MoET\Recruitment'
            Backoffice = @{ SiteName = 'MoET Recruitment Backoffice'; AppPool = 'MoetRecruitmentBackoffice'; HostName = ''; IpAddress = '*'; HttpsPort = 0; HttpPort = 8081; CertificateThumbprint = ''; LocalPort = 5080
              Settings = @{ DB_CONNECTION = 'Server=127.0.0.1,1;Database=None;User Id=x;Password=x;Connect Timeout=2;TrustServerCertificate=True'; MIGRATE_ON_START = '0'; RUN_WORKERS = '0'
                PORTAL_API_KEY = '$key'; PORTAL_API_SECRET = '$secret'; AGENT_KEY = 'ci-agent-key-0123456789' } }
            Portal = @{ SiteName = 'MoET Careers Portal'; AppPool = 'MoetCareersPortal'; HostName = ''; IpAddress = '*'; HttpsPort = 0; HttpPort = 8082; CertificateThumbprint = ''; LocalPort = 0
              Settings = @{ RECRUITMENT_API_URL = 'http://127.0.0.1:5080'; CAREERS_PORTAL_API_KEY = '$key'; CAREERS_PORTAL_API_SECRET = '$secret'; SESSION_SECRET = 'ci-session-secret-0123456789-0123456789' } }
          }
          "@ | Set-Content C:\moet.settings.psd1
          Expand-Archive out\moet-recruitment-iis.zip C:\package
          & C:\package\iis\Install-Moet.ps1 -SettingsFile C:\moet.settings.psd1

      - name: Check the sites
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          function Hit([string]$method, [string]$url, [hashtable]$headers = @{}, [string]$body = $null) {
            # HttpWebRequest directly: no redirects followed, and error responses read like any other.
            $req = [Net.HttpWebRequest]::Create($url)
            $req.Method = $method; $req.AllowAutoRedirect = $false; $req.Timeout = 60000
            foreach ($k in $headers.Keys) { if ($k -eq 'Origin') { $req.Headers.Add('Origin', $headers[$k]) } else { $req.Headers[$k] = $headers[$k] } }
            if ($body) {
              $req.ContentType = 'application/json'
              $bytes = [Text.Encoding]::UTF8.GetBytes($body)
              $stream = $req.GetRequestStream(); $stream.Write($bytes, 0, $bytes.Length); $stream.Close()
            }
            try { $resp = $req.GetResponse() } catch [Net.WebException] { $resp = $_.Exception.Response; if (-not $resp) { throw } }
            $text = (New-Object IO.StreamReader($resp.GetResponseStream())).ReadToEnd()
            $result = @{ Status = [int]$resp.StatusCode; Body = $text; Headers = $resp.Headers }
            $resp.Close()
            return $result
          }
          function Expect([string]$what, [bool]$ok, $detail) {
            if ($ok) { Write-Host "ok   $what" } else { Write-Host "FAIL $what :: $detail"; $script:bad++ }
          }
          $bad = 0

          $r = Hit GET 'http://localhost:8081/'
          Expect 'backoffice serves the app' ($r.Status -eq 200 -and $r.Body -match 'id="root"') $r.Status
          Expect 'backoffice sends its security headers' ($r.Headers['Content-Security-Policy'] -match "frame-ancestors 'none'") $r.Headers['Content-Security-Policy']
          $r = Hit GET 'http://localhost:8081/ar/jobs/123'
          Expect 'backoffice app routes fall back to index.html' ($r.Status -eq 200 -and $r.Body -match 'id="root"') $r.Status
          $asset = [regex]::Match($r.Body, '/assets/[^"]+\.js').Value
          $a = Hit GET "http://localhost:8081$asset"
          Expect "backoffice serves $asset for a year" ($a.Status -eq 200 -and $a.Headers['Cache-Control'] -match 'immutable') "$($a.Status) $($a.Headers['Cache-Control'])"
          $r = Hit GET 'http://localhost:8081/assets/missing.js'
          Expect 'a missing asset is 404, not the app' ($r.Status -eq 404) $r.Status
          $r = Hit GET 'http://localhost:8081/api/backoffice/me'
          Expect 'backoffice /api answers (401 signed out)' ($r.Status -eq 401) "$($r.Status) $($r.Body)"
          $r = Hit GET 'http://localhost:8081/api/backoffice/nothing%2Bhere?q=50%25'
          Expect 'encoded characters reach the API' ($r.Status -in 401, 404) "$($r.Status) $($r.Body)"
          $r = Hit POST 'http://localhost:8081/api/backoffice/sign-in' @{ 'X-Backoffice' = '1'; Origin = 'http://evil.example' } '{"email":"a@b.c","password":"x"}'
          Expect 'a staff write from another site is refused' ($r.Status -eq 403) $r.Status
          $r = Hit POST 'http://localhost:8081/api/backoffice/sign-in' @{ 'X-Backoffice' = '1'; Origin = 'http://localhost:8081' } '{"email":"a@b.c","password":"x"}'
          Expect 'a staff write from the backoffice passes the same-origin check' ($r.Status -ne 403) "$($r.Status) $($r.Body)"
          $r = Hit GET 'http://localhost:8081/healthz'
          Expect 'backoffice health' ($r.Status -eq 200) $r.Status

          $r = Hit GET 'http://localhost:8082/'
          Expect 'portal redirects to a language' ($r.Status -eq 302) $r.Status
          $r = Hit GET 'http://localhost:8082/ar/jobs'
          Expect 'portal serves the app' ($r.Status -eq 200 -and $r.Body -match 'id="root"') $r.Status
          $asset = [regex]::Match($r.Body, '/assets/[^"]+\.js').Value
          $a = Hit GET "http://localhost:8082$asset"
          Expect "portal serves $asset" ($a.Status -eq 200 -and $a.Headers['Cache-Control'] -match 'immutable') "$($a.Status) $($a.Headers['Cache-Control'])"
          $r = Hit GET 'http://localhost:8082/assets/..%5C..%5Cweb.config'
          Expect 'portal never serves its own settings' ($r.Body -notmatch 'SESSION_SECRET') $r.Status
          $r = Hit GET 'http://localhost:8082/web.config'
          Expect 'portal never serves web.config' ($r.Body -notmatch 'SESSION_SECRET') $r.Status
          $r = Hit GET 'http://localhost:8081/web.config'
          Expect 'backoffice never serves web.config' ($r.Body -notmatch 'AGENT_KEY') $r.Status
          $r = Hit GET 'http://localhost:8082/api/config?lang=ar'
          Expect 'portal server reaches the API with its key' ($r.Status -ne 403 -and $r.Status -ne 401) "$($r.Status) $($r.Body)"
          $r = Hit POST 'http://localhost:8082/api/login' @{ 'X-Portal' = '1'; Origin = 'http://localhost:8082' } '{"email":"a@b.c","password":"x"}'
          Expect 'a candidate write passes the same-origin check' ($r.Status -ne 403) "$($r.Status) $($r.Body)"

          $r = Hit GET 'http://127.0.0.1:5080/healthz'
          Expect 'API health on the local binding (where the portal reaches it)' ($r.Status -eq 200) $r.Status
          $r = Hit GET 'http://localhost:8081/api/portal/config' @{ Authorization = 'token wrong:key' }
          Expect 'the portal API refuses a wrong key' ($r.Status -eq 401 -or $r.Status -eq 403) $r.Status

          $env:PLAYWRIGHT_BROWSERS_PATH = 'C:\MoET\Recruitment\ms-playwright'
          & dotnet C:\MoET\Recruitment\backoffice\Moet.Recruitment.Api.dll --pdf-check C:\letter.pdf
          Expect 'PDF letter prints with the bundled Chromium' ((Test-Path C:\letter.pdf) -and (Get-Item C:\letter.pdf).Length -gt 10000) $LASTEXITCODE

          if ($bad -gt 0) { throw "$bad check(s) failed" }

      - name: Logs on failure
        if: failure()
        shell: powershell
        run: |
          Get-WinEvent -LogName Application -MaxEvents 60 | Where-Object { $_.ProviderName -match 'IIS|ASP.NET|\.NET' } | Format-List TimeCreated, ProviderName, Message
          Get-ChildItem C:\MoET\Recruitment\*\logs\* -ErrorAction SilentlyContinue | ForEach-Object { "--- $($_.FullName)"; Get-Content $_.FullName -Tail 80 }
          Get-ChildItem C:\MoET\Recruitment\*\web.config | ForEach-Object { "--- $($_.FullName)"; (Get-Content $_.FullName -Raw) -replace '(name="[^"]*(KEY|SECRET|PASSWORD|CONNECTION)[^"]*" value=")[^"]*', '$1***' }
