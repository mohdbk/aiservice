name: Checkbox probe
on:
  workflow_dispatch:
  push:
    branches: [dotnet-backend]
    paths: ["e2e/checkbox-probe.mjs", ".github/workflows/checkbox-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd portal/web && npm install --no-audit --no-fund >/dev/null && npm run build >/dev/null
      - run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm install playwright@1.49.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cd $GITHUB_WORKSPACE && NODE_PATH=/tmp/pw/node_modules node --experimental-default-type=module -e "process.chdir('$GITHUB_WORKSPACE')" && cp e2e/checkbox-probe.mjs /tmp/pw/ && cd /tmp/pw && ln -s $GITHUB_WORKSPACE/portal portal && node checkbox-probe.mjs
