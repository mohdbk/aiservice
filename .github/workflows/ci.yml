name: CI

# Repository-wide house rule (Ministry of Economy & Tourism): no em dashes in source, text or docs.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  house-style:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: No em dashes anywhere
        run: |
          python - <<'PY'
          import pathlib, sys
          skip = {".git", "node_modules", "bin", "obj", "dist"}
          bad = [f"{p}:{i}" for p in pathlib.Path(".").rglob("*")
                 if p.is_file() and not skip & set(p.parts) and p.suffix in {".cs", ".ts", ".tsx", ".js", ".mjs", ".json", ".md", ".yml", ".sql", ".ps1", ".psd1", ".config", ".html", ".css"}
                 for i, line in enumerate(p.read_text(encoding="utf-8", errors="ignore").splitlines(), 1)
                 if chr(0x2014) in line]
          print("\n".join(bad)); sys.exit(1 if bad else 0)
          PY
