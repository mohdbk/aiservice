name: Backoffice

on:
  push:
    branches: [main, dotnet-backend]
    paths: ["backoffice/**", ".github/workflows/backoffice.yml"]
  pull_request:
    paths: ["backoffice/**", ".github/workflows/backoffice.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backoffice/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: No em dashes
        run: "! grep -rnI $'\\u2014' src/ || (echo 'em dash found' && exit 1)"
      - name: Container image builds and serves the app
        run: |
          docker build -t moet-recruitment-backoffice .
          docker run -d --name bo -p 8088:8080 -e API_URL=http://127.0.0.1:9 moet-recruitment-backoffice
          for i in $(seq 1 20); do curl -sf http://localhost:8088/healthz && break; sleep 1; done
          curl -sf http://localhost:8088/ar/applicants | grep -q '<div id="root">'
          curl -sI http://localhost:8088/ | grep -qi 'content-security-policy'
          docker logs bo
