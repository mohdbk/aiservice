name: Backoffice

on:
  push:
    branches: [main, dotnet-backend]
    paths: ["backoffice/**", ".github/workflows/backoffice.yml"]
  pull_request:
    paths: ["backoffice/**", ".github/workflows/backoffice.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backoffice/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: No em dashes
        run: "! grep -rnI $'\\u2014' src/ || (echo 'em dash found' && exit 1)"
