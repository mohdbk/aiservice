# Careers portal: build, test and design preview. Screenshots every page (mock Frappe, Arabic and English,
# desktop and phone) and, if given, the live portal. Images are pushed to the "screenshots" branch.
name: Portal preview
on:
  workflow_dispatch:
    inputs:
      live:
        description: Live portal URL to screenshot (optional)
        default: ""
  push:
    branches: [main]
    paths: ["portal/**", ".github/workflows/portal-preview.yml"]
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Server tests
        run: cd portal/server && npm test
      - name: Build web
        run: cd portal/web && npm install --no-audit --no-fund && npm run build
      - name: Type check (report only)
        continue-on-error: true
        run: cd portal/web && npm run typecheck
      - name: Screenshots
        env: { LIVE: "${{ inputs.live }}" }
        run: |
          cd /tmp && npm init -y >/dev/null && npm install playwright@1.49.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cd "$GITHUB_WORKSPACE/portal/server"
          (MOCK_FRAPPE=1 COOKIE_SECURE=0 PORT=8080 node src/server.js > /tmp/server.log 2>&1 &) ; sleep 2
          cat > /tmp/shot.cjs <<'JS'
          const { chromium, devices } = require('/tmp/node_modules/playwright');
          const fs = require('fs');
          const B = 'http://localhost:8080';
          (async () => {
            const b = await chromium.launch(); fs.mkdirSync('/tmp/shots', { recursive: true });
            const shoot = async (ctx, name, path) => {
              const p = await ctx.newPage();
              await p.goto(B + path, { waitUntil: 'networkidle' }); await p.waitForTimeout(400);
              await p.screenshot({ path: `/tmp/shots/${name}.png`, fullPage: true }); await p.close();
            };
            const desk = await b.newContext({ viewport: { width: 1366, height: 900 } });
            const phone = await b.newContext({ ...devices['iPhone 13'] });
            for (const l of ['ar', 'en']) {
              await shoot(desk, `${l}_01_jobs`, `/${l}`);
              await shoot(desk, `${l}_02_job`, `/${l}/jobs/HR-OPN-2026-0001`);
              await shoot(desk, `${l}_03_sign_in`, `/${l}/sign-in?next=/${l}/jobs/HR-OPN-2026-0003/apply`);
              await shoot(desk, `${l}_04_create_account`, `/${l}/create-account`);
            }
            await shoot(desk, 'ar_02b_job_untranslated', '/ar/jobs/HR-OPN-2026-0003');
            await shoot(desk, 'ar_11_check_email', '/ar/check-email?email=sara%40example.com');
            await shoot(desk, 'en_12_forgot_password', '/en/forgot-password');
            await shoot(desk, 'ar_13_reset_password', '/ar/reset-password?token=preview');
            await shoot(phone, 'phone_ar_sign_in', '/ar/sign-in');
            for (const ctx of [desk, phone]) {
              const r = await ctx.request.post(B + '/api/login', { headers: { 'X-Portal': '1' }, data: { email: 'layla@example.com', password: 'password123' } });
              if (!r.ok()) throw new Error('login failed ' + r.status());
            }
            for (const l of ['ar', 'en']) {
              await shoot(desk, `${l}_05_apply`, `/${l}/jobs/HR-OPN-2026-0003/apply`);
              await shoot(desk, `${l}_06_applications`, `/${l}/applications`);
              await shoot(desk, `${l}_07_application`, `/${l}/applications/HR-APP-2026-00012?new=1`);
            }
            await shoot(desk, 'ar_08_application_preparing', '/ar/applications/HR-APP-2026-00007');
            await shoot(desk, 'ar_16_assessments', '/ar/assessments');
            await shoot(desk, 'en_17_assessment_intro', '/en/assessments/AINV-00001');
            await shoot(desk, 'ar_18_assessment_done', '/ar/assessments/AINV-00002');
            { const r = await desk.request.post(B + '/api/assessments/AINV-00001/start', { headers: { 'X-Portal': '1' }, data: { lang: 'ar' } });
              if (!r.ok()) throw new Error('start failed ' + r.status()); }
            await shoot(desk, 'ar_19_assessment_take', '/ar/assessments/AINV-00001/take');
            await shoot(desk, 'en_20_assessment_take', '/en/assessments/AINV-00001/take');
            await shoot(phone, 'phone_ar_assessment_take', '/ar/assessments/AINV-00001/take');
            await shoot(desk, 'ar_09_not_found', '/ar/nothing-here');
          { const g = await b.newContext({ viewport: { width: 1366, height: 900 } }); const p = await g.newPage();
            await p.goto(B + '/en', { waitUntil: 'networkidle' }); await p.click('button[aria-controls="account-menu"]'); await p.waitForTimeout(300);
            await p.screenshot({ path: '/tmp/shots/en_14_account_menu_guest.png' }); await g.close(); }
          { const p = await desk.newPage(); await p.goto(B + '/ar', { waitUntil: 'networkidle' }); await p.click('button[aria-controls="account-menu"]'); await p.waitForTimeout(300);
            await p.screenshot({ path: '/tmp/shots/ar_15_account_menu_signed_in.png' }); await p.close(); }
          for (const [ctx, name] of [[desk, 'ar_10_accessibility_menu'], [phone, 'phone_ar_accessibility_menu']]) {
            const p = await ctx.newPage();
            await p.goto(B + '/ar', { waitUntil: 'networkidle' });
            await p.click('button[aria-controls="a11y-panel"]'); await p.waitForTimeout(300);
            await p.screenshot({ path: `/tmp/shots/${name}.png` }); await p.close();
          }
            await shoot(phone, 'phone_ar_jobs', '/ar');
            await shoot(phone, 'phone_ar_job', '/ar/jobs/HR-OPN-2026-0001');
            await shoot(phone, 'phone_ar_apply', '/ar/jobs/HR-OPN-2026-0003/apply');
            await shoot(phone, 'phone_ar_application', '/ar/applications/HR-APP-2026-00012');
            if (process.env.LIVE) {
              const live = await b.newContext({ viewport: { width: 1366, height: 900 } });
              for (const [n, path] of [['live_ar_jobs', '/ar'], ['live_en_jobs', '/en'], ['live_ar_sign_in', '/ar/sign-in']]) {
                const p = await live.newPage();
                try { await p.goto(process.env.LIVE.replace(/\/$/, '') + path, { waitUntil: 'networkidle', timeout: 60000 }); await p.waitForTimeout(800);
                      await p.screenshot({ path: `/tmp/shots/${n}.png`, fullPage: true }); } catch (e) { console.log(n, e.message); }
                await p.close();
              }
            }
            await b.close();
          })().catch((e) => { console.error(e); process.exit(1); });
          JS
          sed -i 's/^          //' /tmp/shot.cjs && node /tmp/shot.cjs || (cat /tmp/server.log; exit 1)
      - name: Push to screenshots branch
        if: always()
        run: |
          test -d /tmp/shots || exit 0
          cd /tmp/shots && git init -q -b screenshots && git add . \
            && git -c user.name=preview -c user.email=preview@localhost commit -qm "Portal preview ${GITHUB_SHA::7}" \
            && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screenshots
